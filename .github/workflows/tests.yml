name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run hardware-free core tests
        working-directory: container-profiler
        run: python -m unittest discover -s tests -p "test_*_unit.py" -v
      - name: Compile sources
        run: python -m compileall -q container-profiler/src
